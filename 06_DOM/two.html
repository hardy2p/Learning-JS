<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>
<style>
    body{
        background-color: #212121;
        color: #fff;
    }
</style>
<body>
    <div class="parent">
        <div class="days">Monday</div>
        <div class="days">Tuesday</div>
        <div class="days">Wednesday</div>
        <div class="days">Thursday</div>
    </div>
</body>
<script>
    const parent=document.querySelector('.parent');
    console.log(parent);
    console.log(parent.children);
    //This return an html collection so to use other prop such as map ,filter , reduce we need to convert this into array using Array.from() method.
    console.log(parent.children[1].innerHTML);

    //we can use conventional for loop on this HTML collection though
    for (let i = 0; i < parent.children.length; i++) {
        console.log(parent.children[i].innerHTML);
    }
    parent.children[1].style.color="orange";
    console.log(parent.firstElementChild);//Return the element present at 0th index in html colllection
    console.log(parent.lastElementChild);//Last element of html collection
    const dayOne=document.querySelector('.days');
    console.log(dayOne.parentElement);
    console.log(dayOne.parentElement.childNodes);
    
</script>
</html>
