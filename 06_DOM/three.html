<script>
    //Create a div element in body now 
   const div= document.createElement('div');
   console.log(div);
   div.className="main";
   div.id=Math.round(Math.random()*10+1);
   div.setAttribute('title','mainTitle');
   div.style.backgroundColor="green";
   div.style.padding="12px";
   //div.innerText="Pushpendra Singh";//It OverWrites the value
   const addText=document.createTextNode("Pushpendra singh");
   div.append(addText)
   document.body.append(div);
   //Now attach it to screen
</script>
