<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai and code</title>
    <style>
        body{
            background-color: #212121;
            color: #fff;
        }
    </style>
</head>
<body>
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addLang(langName){
        const li=document.createElement('li');
        li.innerHTML=`${langName}`;
        document.querySelector('.language').appendChild(li);
    }
    addLang("Python");

    //Optimized way to do it 
    function addLangOpti(langName){
        const li=document.createElement('li');
        li.appendChild(document.createTextNode(langName));//Saves a round trip which was done by .innerHTML
        document.querySelector('.language').appendChild(li);
    }
    addLangOpti("Typescript");
</script>
</html>
